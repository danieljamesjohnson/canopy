<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sketch 001 — Unified Today screen</title>
<link rel="stylesheet" href="../themes/default.css">
<style>
/* ── shared timeline styling ─────────────────────────────────────── */
.head {
  padding: 18px 20px 10px;
  border-bottom: 1px solid var(--outline-variant);
  background: var(--surface);
}
.head .row { display: flex; align-items: baseline; justify-content: space-between; }
.head h1 { margin: 0; font-size: 22px; font-weight: 650; letter-spacing: -.01em; }
.head .date { font-size: 13px; color: var(--on-surface-variant); }
.mood {
  margin-top: 8px; display: inline-flex; align-items: center; gap: 6px;
  background: var(--secondary-container); color: var(--on-secondary-container);
  border-radius: var(--radius-pill); padding: 4px 11px; font-size: 12.5px;
}

.day { flex: 1 1 auto; overflow-y: auto; padding: 10px 0 40px; scroll-behavior: smooth; }

.item { display: flex; gap: 10px; padding: 0 16px; }
.time {
  flex: 0 0 46px; text-align: right; font-family: var(--mono);
  font-size: 12px; color: var(--on-surface-variant); padding-top: 13px;
}
.body { flex: 1 1 auto; min-width: 0; }

.card {
  border: 1px solid var(--outline-variant);
  background: var(--surface-container);
  border-radius: var(--radius-card);
  padding: 11px 13px; margin: 4px 0;
  display: flex; align-items: center; gap: 10px;
}
.card .title { font-size: 14.5px; font-weight: 500; flex: 1 1 auto; }
.card .meta { font-size: 12px; color: var(--on-surface-variant); }
.card.done { opacity: .5; }
.card.done .title { text-decoration: line-through; text-decoration-thickness: 1px; }
.card.skipped { opacity: .45; }
.card.skipped .title { text-decoration: line-through; }
.card.brk { background: transparent; border-style: dashed; }
.card.brk .title { font-weight: 400; color: var(--on-surface-variant); }
.card.commitment { background: var(--tertiary-container); color: var(--on-tertiary-container); border-color: transparent; }
.tick { font-size: 13px; color: var(--primary); }

.free {
  margin: 4px 0; padding: 9px 13px;
  font-size: 12.5px; color: var(--on-surface-variant);
  border-left: 2px dotted var(--outline-variant); border-radius: 0;
  background: transparent;
}

/* the live row — shared by all variants */
.now {
  margin: 8px 0; padding: 14px 15px;
  border-radius: 16px;
  background: var(--primary-container); color: var(--on-primary-container);
  border: 1px solid transparent;
  box-shadow: 0 2px 10px rgba(34,105,91,.16);
}
.now .kicker { font-size: 11px; letter-spacing: .09em; text-transform: uppercase; opacity: .72; }
.now .what { font-size: 19px; font-weight: 640; margin: 3px 0 2px; letter-spacing: -.01em; }
.now .left { font-family: var(--mono); font-size: 13px; opacity: .82; }
.bar { height: 5px; border-radius: 4px; background: rgba(0,0,0,.13); margin: 11px 0 0; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--primary); border-radius: 4px; transition: width 1s linear; }
.acts { display: flex; gap: 8px; margin-top: 12px; }
.acts button {
  font: inherit; font-size: 13px; cursor: pointer; padding: 7px 14px;
  border-radius: var(--radius-pill); border: 1px solid var(--primary);
  background: var(--primary); color: var(--on-primary); font-weight: 500;
}
.acts button.ghost { background: transparent; color: var(--on-primary-container); border-color: rgba(0,0,0,.22); }
.now .next { margin-top: 11px; font-size: 12.5px; opacity: .78; }

/* ── variant B: sticky recall bar ────────────────────────────────── */
.recall {
  position: absolute; left: 12px; right: 12px; top: 8px; z-index: 20;
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; border-radius: var(--radius-pill);
  background: var(--primary); color: var(--on-primary);
  box-shadow: 0 4px 16px rgba(0,0,0,.22);
  font-size: 13.5px;
  transform: translateY(-140%); opacity: 0;
  transition: transform .26s cubic-bezier(.2,.8,.3,1), opacity .2s;
  cursor: pointer;
}
.recall.show { transform: translateY(0); opacity: 1; }
.recall .dot { width: 7px; height: 7px; border-radius: 50%; background: #fff; animation: pulse 2s infinite; }
.recall .t { flex: 1 1 auto; font-weight: 500; }
.recall .c { font-family: var(--mono); opacity: .85; }
@keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }

/* ── variant C: time rail ────────────────────────────────────────── */
.rail-item { display: flex; gap: 0; padding: 0 16px; }
.rail-time {
  flex: 0 0 52px; font-family: var(--mono); font-size: 11.5px;
  color: var(--on-surface-variant); padding-top: 12px;
}
.rail {
  flex: 0 0 16px; position: relative;
}
.rail::before {
  content: ""; position: absolute; left: 6px; top: 0; bottom: 0;
  width: 2px; background: var(--outline-variant);
}
.rail.dashed::before { background: repeating-linear-gradient(to bottom, var(--outline-variant) 0 3px, transparent 3px 8px); }
.rail.filled::before { background: var(--primary); opacity: .35; }
.rail .knob {
  position: absolute; left: 1px; top: 14px; width: 12px; height: 12px;
  border-radius: 50%; background: var(--surface); border: 2px solid var(--outline-variant);
}
.rail.filled .knob { background: var(--primary); border-color: var(--primary); }
.rail .progress {
  position: absolute; left: 6px; top: 0; width: 2px; background: var(--primary);
  transition: height 1s linear;
}
.rail-body { flex: 1 1 auto; min-width: 0; padding-left: 8px; }
.rail-body .lite { padding: 11px 0; font-size: 14px; border-bottom: 1px solid rgba(0,0,0,.045); }
.rail-body .lite.done { opacity: .45; text-decoration: line-through; text-decoration-thickness: 1px; }
.rail-body .lite .sub { font-size: 12px; color: var(--on-surface-variant); text-decoration: none; display: block; }
.rail-body .lite.brk { color: var(--on-surface-variant); font-size: 13px; }
.rail-body .freec { padding: 11px 0; font-size: 12.5px; color: var(--on-surface-variant); font-style: italic; }

.empty {
  margin: 30px 20px; padding: 22px 18px; text-align: center;
  border: 1px dashed var(--outline-variant); border-radius: var(--radius-card);
  color: var(--on-surface-variant); font-size: 14px; line-height: 1.55;
}
.empty b { display: block; font-size: 17px; color: var(--on-surface); font-weight: 600; margin-bottom: 6px; }

.panel { display: none; flex-direction: column; height: 100%; }
.panel.active { display: flex; }
</style>
</head>
<body data-mood="3">

<div class="toolbar">
  <div class="group">
    <span class="label">Variant</span>
    <button data-variant="a" aria-pressed="true">★ A · Pure inline</button>
    <button data-variant="b" aria-pressed="false">B · Sticky recall</button>
    <button data-variant="c" aria-pressed="false">C · Time rail</button>
  </div>
  <div class="group">
    <span class="label">State</span>
    <button data-state="prestart" aria-pressed="false">Before 8am</button>
    <button data-state="break" aria-pressed="true">On a break</button>
    <button data-state="lastmin" aria-pressed="false">Last minute</button>
    <button data-state="chunk" aria-pressed="false">Mid-chunk</button>
    <button data-state="done" aria-pressed="false">Day done</button>
  </div>
  <div class="group">
    <span class="label">Mood</span>
    <button data-mood="1" aria-pressed="false">Low</button>
    <button data-mood="3" aria-pressed="true">Steady</button>
    <button data-mood="5" aria-pressed="false">Sunny</button>
  </div>
  <span class="spacer"></span>
  <span class="clock" id="clock">--:--</span>
</div>

<p class="note">
  <strong>Winner: A · Pure inline.</strong> Countdown rule locked — whole minutes ("3 min left")
  until under one minute remains, then a seconds countdown ("42s left"). Hit
  <em>Last minute</em> to watch the switch.
</p>

<div class="stage">
  <div class="phone">
    <div class="recall" id="recall" hidden>
      <span class="dot"></span><span class="t" id="recallT">On a break</span><span class="c" id="recallC">3:04</span>
    </div>
    <div class="head">
      <div class="row"><h1>Today</h1><span class="date">Tue 4 Aug</span></div>
      <div class="mood" id="moodChip">🌤️ Steady day · 9 chunks</div>
    </div>
    <div class="panel active" id="panel-a"><div class="day" id="day-a"></div></div>
    <div class="panel" id="panel-b"><div class="day" id="day-b"></div></div>
    <div class="panel" id="panel-c"><div class="day" id="day-c"></div></div>
  </div>
</div>

<script>
// ── the day ────────────────────────────────────────────────────────
// Mirrors the real generator's shape: 25-min work chunks, 5-min short
// breaks between, a 25-min long break after the 4th chunk (mood 3
// cadence), and an anchored commitment that is never dropped.
const M = (h, m) => h * 60 + m;
const PLAN = [
  { s: M(8,0),  d: 25, k: 'work',  t: 'Exercise',        g: 'gives'  },
  { s: M(8,25), d: 5,  k: 'brk',   t: 'Short break'                  },
  { s: M(8,30), d: 25, k: 'work',  t: 'Side project',    g: 'costs'  },
  { s: M(8,55), d: 5,  k: 'brk',   t: 'Short break'                  },
  { s: M(9,0),  d: 25, k: 'work',  t: 'Side project',    g: 'costs', skip: true },
  { s: M(9,25), d: 5,  k: 'brk',   t: 'Short break'                  },
  { s: M(9,30), d: 25, k: 'work',  t: 'Learn something', g: 'neutral'},
  { s: M(9,55), d: 25, k: 'long',  t: 'Long break'                   },
  { s: M(10,20),d: 25, k: 'work',  t: 'Family time',     g: 'gives'  },
  { s: M(10,45),d: 5,  k: 'brk',   t: 'Short break'                  },
  { s: M(10,50),d: 25, k: 'work',  t: 'Reading',         g: 'gives'  },
  { s: M(11,15),d: 5,  k: 'brk',   t: 'Short break'                  },
  { s: M(13,0), d: 180,k: 'cmt',   t: 'Job — work block'             },
  { s: M(17,30),d: 25, k: 'work',  t: 'Exercise',        g: 'gives'  },
  { s: M(17,55),d: 5,  k: 'brk',   t: 'Short break'                  },
  { s: M(18,0), d: 25, k: 'work',  t: 'Family time',     g: 'gives'  },
];
const STATES = {
  prestart: M(7,12),
  break:    M(10,45) + 2,   // 2 min into the 5-min short break
  lastmin:  M(10,50) - 0.7, // 42s left — the seconds-countdown threshold
  chunk:    M(10,50) + 8,   // 8 min into a 25-min chunk
  done:     M(19,40),
};
const MOODS = {
  1: { chip: '🌧️ Low day · 4 chunks',    label: 'Low' },
  3: { chip: '🌤️ Steady day · 9 chunks', label: 'Steady' },
  5: { chip: '☀️ Sunny day · 11 chunks', label: 'Sunny' },
};

let variant = 'a', state = 'break', baseMin = STATES.break, t0 = Date.now();

const fmt = (min) => {
  const h = Math.floor(min / 60) % 24, m = Math.round(min % 60);
  const ap = h < 12 ? 'am' : 'pm', hh = h % 12 === 0 ? 12 : h % 12;
  return `${hh}:${String(m).padStart(2,'0')}${ap}`;
};
const fmtShort = (min) => {
  const h = Math.floor(min / 60) % 24, m = Math.round(min % 60);
  const hh = h % 12 === 0 ? 12 : h % 12;
  return `${hh}:${String(m).padStart(2,'0')}${h >= 12 ? 'p' : ''}`;
};
const dur = (mins) => mins >= 60
  ? `${Math.floor(mins/60)}h${mins % 60 ? ' ' + (mins%60) + 'm' : ''}`
  : `${mins}m`;
const nowMin = () => baseMin + (Date.now() - t0) / 60000;

// Remaining-time readout. LOCKED (Dan, sketch 001): stay on whole minutes
// until under one minute remains, then switch to a seconds countdown. A
// per-second clock running all day reads as pressure; in the last minute it
// reads as "about to change".
const remain = (leftMin) => {
  const secs = leftMin * 60;
  if (secs >= 60) return `${Math.ceil(leftMin)} min left`;
  return `${Math.max(0, Math.floor(secs))}s left`;
};

// Build the render list: plan items plus named free-time gaps.
function rows() {
  const out = [];
  const first = PLAN[0];
  out.push({ free: true, s: 0, e: first.s, lead: true });
  for (let i = 0; i < PLAN.length; i++) {
    const it = PLAN[i];
    out.push({ ...it, e: it.s + it.d });
    const nx = PLAN[i + 1];
    if (nx && nx.s > it.s + it.d + 1) out.push({ free: true, s: it.s + it.d, e: nx.s });
  }
  return out;
}
const status = (r, n) => r.skip ? 'skipped' : (r.e <= n ? 'done' : (r.s <= n && n < r.e ? 'current' : 'upcoming'));
const label = (r) => r.k === 'cmt' ? r.t : r.t;

function currentRow(n) { return rows().find(r => !r.free && r.s <= n && n < r.e && !r.skip); }
function nextRow(n)    { return rows().find(r => !r.free && r.s > n); }

// ── the live "now" block, shared by variants A and B ──────────────
function nowBlock(r, n) {
  const left = r.e - n;
  const pct = Math.min(100, Math.max(0, ((n - r.s) / r.d) * 100));
  const isBreak = r.k === 'brk' || r.k === 'long';
  const nx = nextRow(n);
  return `
    <div class="now">
      <div class="kicker">${isBreak ? 'Right now — resting' : 'Right now'}</div>
      <div class="what">${isBreak ? (r.k === 'long' ? 'Taking a long break' : 'Taking a break') : r.t}</div>
      <div class="left">${remain(left)} · until ${fmt(r.e)}</div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      ${isBreak ? '' : `<div class="acts"><button>Complete</button><button class="ghost">Skip</button></div>`}
      ${nx ? `<div class="next">Next · ${nx.t} at ${fmt(nx.s)}</div>` : ''}
    </div>`;
}

function emptyBlock(n) {
  const nx = nextRow(n);
  if (!nx) return `<div class="empty"><b>That's the day.</b>Everything scheduled is behind you. Nothing more is planned tonight.</div>`;
  return `<div class="empty"><b>Nothing until ${fmt(nx.s)}</b>The day starts with ${nx.t}. Until then the time is yours.</div>`;
}

// ── variant A + B renderer ────────────────────────────────────────
function renderList(el, n, withRecall) {
  const cur = currentRow(n);
  let html = '';
  if (!cur) html += emptyBlock(n);
  for (const r of rows()) {
    if (r.free) {
      const len = r.e - r.s;
      if (len < 10) continue;
      html += `<div class="item"><div class="time">${r.lead ? '' : fmtShort(r.s)}</div><div class="body">
        <div class="free">${r.lead ? `Free until ${fmt(r.e)}` : `Free · ${dur(len)}`}</div></div></div>`;
      continue;
    }
    const st = status(r, n);
    if (st === 'current') {
      html += `<div class="item" data-current="1"><div class="time">${fmtShort(r.s)}</div>
        <div class="body">${nowBlock(r, n)}</div></div>`;
      continue;
    }
    const cls = ['card'];
    if (r.k === 'brk' || r.k === 'long') cls.push('brk');
    if (r.k === 'cmt') cls.push('commitment');
    if (st === 'done') cls.push('done');
    if (st === 'skipped') cls.push('skipped');
    html += `<div class="item"><div class="time">${fmtShort(r.s)}</div><div class="body">
      <div class="${cls.join(' ')}">
        <span class="title">${label(r)}</span>
        <span class="meta">${dur(r.d)}</span>
        ${st === 'done' ? '<span class="tick">✓</span>' : ''}
        ${st === 'skipped' ? '<span class="meta">skipped</span>' : ''}
      </div></div></div>`;
  }
  el.innerHTML = html;
}

// ── variant C renderer ────────────────────────────────────────────
function renderRail(el, n) {
  const cur = currentRow(n);
  let html = '';
  if (!cur) html += emptyBlock(n);
  for (const r of rows()) {
    if (r.free) {
      const len = r.e - r.s;
      if (len < 10) continue;
      html += `<div class="rail-item"><div class="rail-time">${r.lead ? '' : fmtShort(r.s)}</div>
        <div class="rail dashed"></div>
        <div class="rail-body"><div class="freec">${r.lead ? `Free until ${fmt(r.e)}` : `Free · ${dur(len)}`}</div></div></div>`;
      continue;
    }
    const st = status(r, n);
    const isBreak = r.k === 'brk' || r.k === 'long';
    if (st === 'current') {
      const left = r.e - n;
      const pct = Math.min(100, Math.max(0, ((n - r.s) / r.d) * 100));
      html += `<div class="rail-item" data-current="1"><div class="rail-time">${fmtShort(r.s)}</div>
        <div class="rail filled"><span class="knob"></span><span class="progress" style="height:${pct}%"></span></div>
        <div class="rail-body">
          <div class="now" style="margin-left:0">
            <div class="kicker">${isBreak ? 'Right now — resting' : 'Right now'}</div>
            <div class="what">${isBreak ? (r.k === 'long' ? 'Taking a long break' : 'Taking a break') : r.t}</div>
            <div class="left">${remain(left)} · until ${fmt(r.e)}</div>
            ${isBreak ? '' : `<div class="acts"><button>Complete</button><button class="ghost">Skip</button></div>`}
          </div>
        </div></div>`;
      continue;
    }
    html += `<div class="rail-item"><div class="rail-time">${fmtShort(r.s)}</div>
      <div class="rail ${st === 'done' ? 'filled' : ''}"><span class="knob"></span></div>
      <div class="rail-body"><div class="lite ${st === 'done' ? 'done' : ''} ${isBreak ? 'brk' : ''}">
        ${label(r)}${isBreak ? '' : `<span class="sub">${dur(r.d)}${st === 'skipped' ? ' · skipped' : ''}</span>`}
      </div></div></div>`;
  }
  el.innerHTML = html;
}

// ── loop ──────────────────────────────────────────────────────────
let recallObs = null;
function paint() {
  const n = nowMin();
  document.getElementById('clock').textContent = fmt(n);
  renderList(document.getElementById('day-a'), n, false);
  renderList(document.getElementById('day-b'), n, true);
  renderRail(document.getElementById('day-c'), n);

  // variant B: show the recall bar only when the live row is off-screen
  const recall = document.getElementById('recall');
  const showB = variant === 'b';
  recall.hidden = !showB;
  if (showB) {
    const cur = currentRow(n);
    if (!cur) { recall.classList.remove('show'); }
    else {
      const left = cur.e - n;
      const isBreak = cur.k === 'brk' || cur.k === 'long';
      document.getElementById('recallT').textContent = isBreak ? 'Taking a break' : cur.t;
      document.getElementById('recallC').textContent = remain(left);
      const row = document.querySelector('#day-b [data-current]');
      if (row && recallObs) { recallObs.disconnect(); recallObs.observe(row); }
    }
  } else recall.classList.remove('show');
}

function scrollToNow() {
  ['a','b','c'].forEach(v => {
    const row = document.querySelector(`#day-${v} [data-current]`);
    if (row) row.scrollIntoView({ block: 'center', behavior: 'auto' });
  });
}

function setState(s) {
  state = s; baseMin = STATES[s]; t0 = Date.now();
  paint(); requestAnimationFrame(scrollToNow);
}

document.querySelectorAll('[data-variant]').forEach(b => b.onclick = () => {
  variant = b.dataset.variant;
  document.querySelectorAll('[data-variant]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('panel-' + variant).classList.add('active');
  paint(); requestAnimationFrame(scrollToNow);
});
document.querySelectorAll('[data-state]').forEach(b => b.onclick = () => {
  document.querySelectorAll('[data-state]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  setState(b.dataset.state);
});
document.querySelectorAll('.toolbar [data-mood]').forEach(b => b.onclick = () => {
  document.querySelectorAll('.toolbar [data-mood]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  document.body.dataset.mood = b.dataset.mood;
  document.getElementById('moodChip').textContent = MOODS[b.dataset.mood].chip;
});
document.getElementById('recall').onclick = scrollToNow;

recallObs = new IntersectionObserver(([e]) => {
  document.getElementById('recall').classList.toggle('show', variant === 'b' && !e.isIntersecting);
}, { root: document.getElementById('day-b'), threshold: 0.35 });

paint();
requestAnimationFrame(scrollToNow);
setInterval(paint, 1000);
</script>
</body>
</html>
