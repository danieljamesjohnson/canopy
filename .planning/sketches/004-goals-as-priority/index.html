<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sketch 004 — the Goals screen as a priority view</title>
<link rel="stylesheet" href="../themes/default.css">
<style>
/* ─────────────────────────────────────────────────────────────────
   Sketch 004. Throwaway. What is real: the goal set and its
   priorityWeight values, the three goal types (timeTarget / outcome /
   habit) and their display order, and the fact that dragging writes
   priorityWeight via reorderAllWithPriority(). No variant changes the
   model — PRIORITY-02/03 settled it in v1.3. These are four ways of
   SAYING the same model out loud.
   ───────────────────────────────────────────────────────────────── */

.phone { height: min(770px, 80vh); }

.appbar { display:flex; align-items:flex-start; justify-content:space-between; padding:14px 16px 6px; flex:0 0 auto; }
.appbar h1 { margin:0; font-size:20px; font-weight:600; letter-spacing:-.01em; }
.appbar .kebab { font-size:19px; color:var(--on-surface-variant); cursor:pointer; padding:0 4px; }

.quickadd { margin:6px 16px 2px; flex:0 0 auto; }
.quickadd .field {
  display:flex; align-items:center; gap:8px; padding:10px 12px;
  border:1px solid var(--outline-variant); border-radius:12px; background:var(--surface);
}
.quickadd input { flex:1 1 auto; border:none; outline:none; font:inherit; font-size:14px; background:transparent; color:var(--on-surface); }
.quickadd .helper { font-size:11px; color:var(--on-surface-variant); padding:5px 4px 0; }

.heading { padding:14px 16px 6px; flex:0 0 auto; }
.heading .h { font-size:15px; font-weight:600; }
.heading .sub { font-size:12px; color:var(--on-surface-variant); margin-top:3px; line-height:1.45; }

.scroller { flex:1 1 auto; overflow-y:auto; padding-bottom:80px; }
.scroller::-webkit-scrollbar { width:6px; }
.scroller::-webkit-scrollbar-thumb { background:var(--outline-variant); border-radius:3px; }

.sectionhdr { padding:14px 16px 4px; font-size:12.5px; font-weight:600; color:var(--primary); }
.sectionhdr .cnt { font-weight:400; color:var(--on-surface-variant); }

/* ── the goal card ────────────────────────────────────────────── */
.gcard {
  position:relative; margin:5px 16px; background:var(--surface);
  border:1px solid var(--outline-variant); border-radius:12px;
  display:flex; align-items:stretch; overflow:hidden;
  transition:box-shadow .15s ease, transform .15s ease;
}
.gcard:hover { box-shadow:0 2px 8px rgba(0,0,0,.07); }
.gcard .stripe { flex:0 0 5px; }
.gcard .main { flex:1 1 auto; padding:11px 4px 11px 12px; min-width:0; }
.gcard .namerow { display:flex; align-items:center; gap:7px; }
.gcard .nm { font-size:15px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.gcard .tico { font-size:13px; opacity:.85; }
.gcard .secondrow { display:flex; align-items:center; gap:6px; margin-top:5px; flex-wrap:wrap; }
.gcard .stat { font-size:11.5px; color:var(--on-surface-variant); }
.gcard .grip { flex:0 0 40px; display:flex; align-items:center; justify-content:center; color:var(--outline-variant); cursor:grab; font-size:15px; letter-spacing:-2px; }
.gcard .swatch { width:14px; height:14px; border-radius:50%; flex:0 0 auto; }

.chip { font-size:10.5px; font-weight:600; padding:3px 8px; border-radius:var(--radius-pill); white-space:nowrap; }
.chip.hi { background:var(--primary-container); color:var(--on-primary-container); }
.chip.lo { background:var(--surface-container-high); color:var(--on-surface-variant); }
.chip.val { background:var(--tertiary-container); color:var(--on-tertiary-container); }
.chip.type { background:var(--surface-container); color:var(--on-surface-variant); border:1px solid var(--outline-variant); font-weight:500; }

/* A — rank badge */
.rank {
  flex:0 0 34px; display:flex; align-items:center; justify-content:center;
  font-family:var(--mono); font-size:14px; font-weight:600;
  color:var(--on-surface-variant); background:var(--surface-container);
  border-right:1px solid var(--outline-variant);
}
.rank.top { background:var(--primary-container); color:var(--on-primary-container); }

/* D — rank and ribbon read as ONE priority gutter, not two decorations */
.rank.d { border-right:none; background:transparent; font-size:15px; color:var(--on-surface); }

/* D — progress. The arithmetic is the engine's own: completed chunks this week
   × 25/60 (schedule_generator._remainingHours). Read from CompletionLog, which
   the Goals screen can reach without touching the generator.
   NO horizontal bar any more (Dan, 2026-09-01: "shouldn't double up on
   progress. just the line on the left going up and down. and color coded") —
   two bars on one card read as two progress meters whatever they encode. The
   numbers stay as text; the left line is the only bar. */
.prog { margin-top:5px; }
.prog .txt { font-size:11px; color:var(--on-surface-variant); }
.prog .txt b { color:var(--on-surface); font-weight:600; }
.prog.none .txt { font-style:italic; opacity:.75; }

/* The legend. Colour that carries meaning it cannot express is the exact defect
   this phase exists to remove, so a colour-coded line has to name its own
   colours somewhere. */
.legend { display:flex; flex-wrap:wrap; gap:10px; padding:8px 16px 2px; }
.legend span { display:inline-flex; align-items:center; gap:5px; font-size:11px; color:var(--on-surface-variant); }
.legend i { width:9px; height:9px; border-radius:2px; display:inline-block; }

/* B — tier bands */
.tier { margin:16px 16px 2px; display:flex; align-items:center; gap:9px; }
.tier .dot { width:9px; height:9px; border-radius:50%; }
.tier .nm { font-size:12.5px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; }
.tier .hint { font-size:11px; color:var(--on-surface-variant); font-weight:400; text-transform:none; letter-spacing:0; }
.tierbody { border-left:2px solid var(--outline-variant); margin-left:20px; padding-left:0; }
.tierbody.hi { border-color:var(--primary); }
.tierbody.mid { border-color:var(--outline-variant); }
.tierbody.lo { border-color:var(--outline-variant); opacity:.86; }
.tierbody .gcard { margin-left:8px; }
.tier-empty { margin:5px 16px 5px 24px; padding:12px; border:1.5px dashed var(--outline-variant); border-radius:12px; font-size:12px; color:var(--on-surface-variant); }

/* C — priority ribbon replaces identity colour on the stripe.
   A linear-gradient, NOT a percent-height child in a flex column: percent
   heights don't resolve reliably against a flex container, and the first
   draft of this rendered 0.35 and 0.90 as near-identical bars — which would
   have made the "is 6dp legible?" question unanswerable for the wrong reason.
   The unfilled track needs real contrast too, or there is nothing to read the
   fill AGAINST. */
.ribbon { flex:0 0 6px; }

.fab {
  position:absolute; right:16px; bottom:16px; z-index:20;
  display:inline-flex; align-items:center; gap:8px;
  padding:14px 20px; border-radius:16px; border:none; cursor:pointer;
  background:var(--primary-container); color:var(--on-primary-container);
  font:inherit; font-size:14px; font-weight:600;
  box-shadow:0 3px 10px rgba(0,0,0,.16);
}

.variant { display:none; }
.variant.active { display:block; }
.note { max-width:430px; margin:0 auto; padding:16px 18px 0; font-size:13px; line-height:1.55; color:#4b5551; }
.note strong { color:#202826; }
.note .q { color:#8a3b2b; font-weight:600; }
.toast { position:fixed; left:50%; transform:translateX(-50%); bottom:22px; background:#101614; color:#e7efeb; padding:9px 16px; border-radius:var(--radius-pill); font-size:13px; opacity:0; pointer-events:none; transition:opacity .2s ease; z-index:200; }
.toast.show { opacity:.95; }

/* The note used to print in full above the mockup. On a 390px phone that put
   ~750px of prose between the toolbar and the first card — you had to scroll
   past an essay to reach the thing you were being asked to judge. Collapsed
   by default; the headline stays, the reasoning is one tap away. */
.note details { border:1px solid #d8e0dc; border-radius:12px; background:#fff; padding:0; }
.note summary { cursor:pointer; padding:12px 14px; list-style:none; font-size:13px; line-height:1.5; }
.note summary::-webkit-details-marker { display:none; }
.note summary .more {
  display:inline-block; margin-left:6px; padding:2px 8px; border-radius:999px;
  background:#eef3f1; color:color:#57635e; vertical-align:1px;
}
.note details[open] summary .more::after { content:'\2212'; }
.note details:not([open]) summary .more::after { content:'+'; }
.note details[open] summary { border-bottom:1px solid #e8eeeb; }
.note .body { padding:12px 14px 14px; font-size:13px; line-height:1.55; }
</style>
</head>
<body data-mood="3">

<div class="toolbar">
  <span class="label">Variant</span>
  <div class="group">
    <button data-v="a" aria-pressed="false">A · Ranked</button>
    <button data-v="b" aria-pressed="false">B · Tiers</button>
    <button data-v="c" aria-pressed="false">C · Ribbon</button>
    <button data-v="d" aria-pressed="false">D · Rank + ribbon ★</button>
    <button data-v="shipped" aria-pressed="false">As shipped</button>
  </div>
  <span class="spacer"></span>
  <span class="label">D only</span>
  <div class="group">
    <button data-group="flat" aria-pressed="true">One list</button>
    <button data-group="typed" aria-pressed="false">Type sections</button>
    <button id="progtoggle" aria-pressed="true">Progress</button>
  </div>
  <span class="label">Left line</span>
  <div class="group">
    <button data-line="priority" aria-pressed="true">= Priority</button>
    <button data-line="progress" aria-pressed="false">= Progress</button>
  </div>
  <span class="label">Outcome rows</span>
  <div class="group">
    <button data-out="due" aria-pressed="true">Due in 12 days</button>
    <button data-out="gap" aria-pressed="false">Say the gap</button>
  </div>
  <span class="label">Mood</span>
  <div class="group">
    <button data-mood="1" aria-pressed="false">1</button>
    <button data-mood="3" aria-pressed="true">3</button>
    <button data-mood="5" aria-pressed="false">5</button>
  </div>
</div>

<div class="note" id="note"></div>

<div class="stage">
  <div class="phone">
    <div class="appbar">
      <div><h1 id="screentitle">Goals</h1></div>
      <span class="kebab" title="View archived · Commitment blocks · What restores you">⋮</span>
    </div>
    <div class="quickadd">
      <div class="field">
        <input placeholder="Add another (6 so far)" />
        <span style="color:var(--primary);font-size:18px;cursor:pointer">＋</span>
      </div>
      <div class="helper">Enter after each, or paste a list — refine details later</div>
    </div>
    <div class="heading" id="heading"></div>
    <div class="scroller" id="scroller"></div>
    <button class="fab">＋ Add goal</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* Real shape: Goal { name, goalType, priorityWeight, color, weeklyHourBudget,
   streakCount, energyValence }. Display order across types is
   timeTarget → outcome → habit (goals_screen.dart _buildFullOrderedIds). */
const TYPE = {
  timeTarget: { icon:'◷', label:'Regular time', section:'Regular time' },
  outcome:    { icon:'⚑', label:'Working toward', section:'Working toward' },
  habit:      { icon:'↻', label:'Daily habit',   section:'Daily habits' },
};

/* `budget` / `doneChunks` are the real plumbing: CompletionLog rows with
   event == completed, this week, for this goal. Hours = chunks × 25/60, which
   is schedule_generator._remainingHours' own arithmetic. `dueDays` is the
   outcome goal's deadline. Outcome goals have NO progress field anywhere in
   the model — that gap is real and variant D shows it rather than inventing a
   percentage. */
let goals = [
  { nm:'Deep work',        ty:'timeTarget', pw:0.90, col:'#3f6375', stat:'10.0 hrs/week', val:null,    budget:10.0, doneChunks:15 },
  { nm:'Guitar',           ty:'timeTarget', pw:0.62, col:'#8a5a2b', stat:'3.0 hrs/week',  val:'gives', budget:3.0,  doneChunks:2  },
  { nm:'Admin',            ty:'timeTarget', pw:0.20, col:'#6f7975', stat:'2.5 hrs/week',  val:'costs', budget:2.5,  doneChunks:6  },
  { nm:'Ship the redesign',ty:'outcome',    pw:0.78, col:'#22695b', stat:null,            val:null,    dueDays:12 },
  { nm:'Tax return',       ty:'outcome',    pw:0.35, col:'#8a3b2b', stat:null,            val:'costs', dueDays:40 },
  { nm:'Morning walk',     ty:'habit',      pw:0.50, col:'#4b8b3b', stat:'12-day streak', val:'gives', freq:7, doneDays:5 },
];

let dGroup = 'flat';      // flat | typed
let dProgress = true;
let dOutcome = 'due';     // due | gap
let dLine = 'priority';   // priority | progress  — what the LEFT LINE encodes

/* Day 5 of a 7-day week, so "expected by now" is 5/7 = 71%. Fixed, not a clock
   read — sketches must render identically every time. */
const WEEK_ELAPSED = 5 / 7;

/* Colours are the app's own roles, and deliberately NOT the error slot — the
   codebase already forbids it for non-errors (goal_card.dart's _ValenceBadge
   doc). Behind is amber, not red: being behind on a goal is information, not a
   fault. */
const STATE = {
  done:    { c:'var(--primary)',        nm:'Done'      },
  ontrack: { c:'#2f8f6b',               nm:'On track'  },
  behind:  { c:'#c08a2e',               nm:'Behind'    },
  none:    { c:'var(--outline-variant)',nm:'Not started / no data' },
};

/** Fraction complete this week, or null when the model has no progress at all. */
function doneFraction(g) {
  if (g.ty === 'timeTarget') return Math.min(1, (g.doneChunks * 25 / 60) / g.budget);
  if (g.ty === 'habit')      return Math.min(1, g.doneDays / g.freq);
  return null;                       // outcome — no progress field exists
}

function stateOf(g) {
  const f = doneFraction(g);
  if (f === null) return 'none';
  if (f >= 0.999) return 'done';
  return f >= WEEK_ELAPSED ? 'ontrack' : 'behind';
}

function progressBlock(g) {
  if (!dProgress) return '';
  if (g.ty === 'timeTarget') {
    const hrs = g.doneChunks * 25 / 60;
    const label = (g.budget - hrs) < 0.1
      ? `<b>Done</b> — ${hrs.toFixed(1)} of ${g.budget.toFixed(1)} hrs this week`
      : `<b>${hrs.toFixed(1)}</b> of ${g.budget.toFixed(1)} hrs this week`;
    return `<div class="prog"><div class="txt">${label}</div></div>`;
  }
  if (g.ty === 'habit') {
    return `<div class="prog"><div class="txt"><b>${g.doneDays} of ${g.freq}</b> days this week · ${g.stat}</div></div>`;
  }
  // Outcome goals have NO progress field anywhere in the model — only `deadline`
  // and `outcomeDescription`. Inventing a percentage would be new state, which is
  // out of scope. So the only real choice is what this row says instead.
  return dOutcome === 'due'
    ? `<div class="prog"><div class="txt">Due in <b>${g.dueDays} days</b></div></div>`
    : `<div class="prog none"><div class="txt">No progress to show — due in ${g.dueDays} days</div></div>`;
}

function legendHTML() {
  const keys = dLine === 'progress' ? ['done','ontrack','behind','none'] : ['done','ontrack','behind','none'];
  const what = dLine === 'progress'
    ? 'Line height = how much of this week is done. Colour ='
    : 'Line height = priority weight. Colour =';
  return `<div class="legend"><span style="font-weight:600;color:var(--on-surface)">${what}</span>` +
    keys.map(k => `<span><i style="background:${STATE[k].c}"></i>${STATE[k].nm}</span>`).join('') + `</div>`;
}

const NOTES = {
  a: `<strong>A · Ranked.</strong> The type sections are gone. One list, numbered 1–6, ordered by
      priority across every type — which is what <code>reorderAllWithPriority()</code> already writes.
      The heading names the page: <em>this order is your priority order</em>. Type moves to a chip.
      <span class="q">The question:</span> a number is unambiguous, but it also makes "6th" feel like
      a verdict. Does an explicit rank help you, or does it make a list of six goals feel like a
      leaderboard you're losing?`,
  b: `<strong>B · Tiers.</strong> Three named bands — High, Normal, Low — and dragging a goal across
      a band boundary is what changes its priority. No goal is ever unlabelled, which kills the dead
      zone: today a goal at 0.5 shows <em>no chip at all</em>, so most goals say nothing about their
      own priority. <span class="q">The question:</span> this trades the type sections for tier
      sections. You lose "all my time-target goals together" — check whether you miss it.`,
  c: `<strong>C · Ribbon.</strong> Smallest change. Type sections stay exactly as they are. The one
      move: the 5dp left border stops being the goal's identity colour and becomes a
      <em>priority ribbon</em> that fills in proportion to <code>priorityWeight</code>. Identity
      colour survives as the dot beside the name. <span class="q">The question:</span> this is the
      direct answer to "the colors are changing, it's not making a ton of sense" — colour now means
      exactly one thing. Is a filled bar legible enough at 6dp, or does it need the words too?`,
  d: `<strong>D · Rank + ribbon — the synthesis (Dan, 2026-09-01).</strong> A's number and C's bar
      do different jobs, so they compose: <em>rank</em> says the order, <em>ribbon</em> says the
      distance. 3rd and 4th could be 0.62 and 0.60 — a hair — or 0.62 and 0.21, a chasm; rank alone
      cannot tell you which, and the ribbon can. Identity colour stays demoted to the dot.
      <br><br><strong>Progress is on, per "showing what's complete can help you re-rank".</strong>
      The numbers are real plumbing, not new engine work: <code>CompletionLog</code> rows for this
      week × 25/60 is exactly what <code>schedule_generator._remainingHours</code> already computes.
      <span class="q">But look at the two Working-toward goals.</span> Outcome goals have <em>no
      progress field anywhere in the model</em> — only a deadline. So a third of your list can only
      say "no progress to show", and that row is louder about the gap than it is useful. Toggle
      <em>Progress</em> off and decide whether the honest version earns its space.`,
  shipped: `<strong>As shipped, for reference.</strong> Title "Goals". Heading "Your goals" with
      <em>"Drag to prioritize. Tap to edit."</em> in 12px grey. Three type sections. The loudest
      thing on each card is a 5dp bar in the goal's own identity colour — which carries no meaning
      at all. Priority appears only as a chip at the extremes: <code>pw ≥ 0.75</code> → High,
      <code>pw ≤ 0.25</code> → Low. Guitar (0.62), Ship the redesign… wait — 0.78, so it shows.
      <strong>Morning walk at 0.50 and Tax return at 0.35 show nothing.</strong>`
};

const HEADINGS = {
  a:       { title:'Goals', h:'Priority order', sub:'Everything you want time for, most important first. Drag to change the order — that <em>is</em> how priority is set.' },
  b:       { title:'Goals', h:'What matters most', sub:'Drag a goal into a different band to change its priority. The scheduler fills High first.' },
  c:       { title:'Goals', h:'Your goals', sub:'The bar on the left is priority — fuller means the scheduler reaches it sooner. Drag to change it. Tap to edit.' },
  // D's subtitle depends on what the left line encodes — resolved in render().
  d:       { title:'Goals', h:'Priority order', sub:null },
  shipped: { title:'Goals', h:'Your goals', sub:'Drag to prioritize. Tap to edit.' }
};

let variant = 'd';   // opens on the synthesis — it is the one under review

function syncVariantButtons() {
  document.querySelectorAll('[data-v]').forEach(b =>
    b.setAttribute('aria-pressed', b.dataset.v === variant));
}

function chips(g) {
  let out = '';
  if (variant === 'a' || variant === 'shipped') {
    if (g.pw >= 0.75)      out += `<span class="chip hi">↑ High</span>`;
    else if (g.pw <= 0.25) out += `<span class="chip lo">↓ Low</span>`;
  }
  if (g.val === 'gives') out += `<span class="chip val">⚡ Gives</span>`;
  if (g.val === 'costs') out += `<span class="chip lo">⧖ Costs</span>`;
  return out;
}

function card(g, extra) {
  const t = TYPE[g.ty];
  let stripe;
  if (variant === 'd') {
    // ONE line. Its height is whichever dimension dLine selects; its colour is
    // always the progress state. No horizontal bar anywhere — no doubling up.
    const f = doneFraction(g);
    const pct = Math.round((dLine === 'progress' ? (f === null ? 0 : f) : g.pw) * 100);
    const col = STATE[stateOf(g)].c;
    const tip = dLine === 'progress'
      ? `${STATE[stateOf(g)].nm} — ${pct}% of this week`
      : `Priority ${g.pw.toFixed(2)} · ${STATE[stateOf(g)].nm}`;
    stripe = `<div class="ribbon" title="${tip}" style="background:linear-gradient(
         to top, ${col} 0 ${pct}%, rgba(0,0,0,.09) ${pct}% 100%)"></div>`;
  } else if (variant === 'c') {
    const pct = Math.round(g.pw * 100);
    stripe = `<div class="ribbon" title="Priority ${g.pw.toFixed(2)}" style="background:linear-gradient(
         to top, var(--primary) 0 ${pct}%, rgba(0,0,0,.10) ${pct}% 100%)"></div>`;
  } else {
    stripe = `<div class="stripe" style="background:${g.col}"></div>`;
  }
  // D shows the type chip only in flat mode — under type sections it repeats the header.
  const typeChip = (variant === 'a' || variant === 'b' ||
                    (variant === 'd' && dGroup === 'flat'))
    ? `<span class="chip type">${t.icon} ${t.label}</span>` : '';
  // D moves the stat into the progress line, so don't print it twice.
  const stat = (variant === 'd' && dProgress) ? null : g.stat;
  const second = (stat || chips(g) || typeChip)
    ? `<div class="secondrow">
         ${stat ? `<span class="stat">${stat}</span>` : ''}
         ${typeChip}${chips(g)}
       </div>` : '';
  return `<div class="gcard">
    ${extra || ''}${stripe}
    <div class="main">
      <div class="namerow">
        ${variant === 'c' || variant === 'shipped' ? `<span class="tico" style="color:${g.col}">${t.icon}</span>` : ''}
        <span class="nm" style="flex:1 1 auto">${g.nm}</span>
        <span class="swatch" style="background:${g.col}"></span>
      </div>
      ${second}
      ${variant === 'd' ? progressBlock(g) : ''}
    </div>
    <div class="grip" title="Drag to reorder">⣿</div>
  </div>`;
}


/* Split the note at the first </strong> so the headline is the summary and the
   reasoning is the collapsed body. */
function setNote(html) {
  const i = html.indexOf('</strong>');
  const head = i > -1 ? html.slice(0, i + 9) : 'About this variant';
  const body = i > -1 ? html.slice(i + 9) : html;
  document.getElementById('note').innerHTML =
    '<details><summary>' + head + '<span class="more"></span></summary>' +
    '<div class="body">' + body + '</div></details>';
}

function render() {
  const H = HEADINGS[variant];
  const sub = H.sub !== null ? H.sub : (dLine === 'progress'
    ? 'Most important first — the number is the order. The line beside it is how much of this week you have done.'
    : 'Most important first. The number is the order; the line beside it is how much weight that goal carries. Drag to change both.');
  document.getElementById('screentitle').textContent = H.title;
  document.getElementById('heading').innerHTML =
    `<div class="h">${H.h}</div><div class="sub">${sub}</div>`;
  setNote(NOTES[variant]);

  const s = document.getElementById('scroller');
  let html = '';

  if (variant === 'a') {
    const ordered = [...goals].sort((x,y) => y.pw - x.pw);
    ordered.forEach((g, i) => {
      html += card(g, `<div class="rank ${i < 2 ? 'top' : ''}">${i+1}</div>`);
    });
  } else if (variant === 'b') {
    const bands = [
      { key:'hi',  nm:'High',   dot:'var(--primary)',          hint:'scheduled first',        test:g => g.pw >= 0.67 },
      { key:'mid', nm:'Normal', dot:'var(--outline)',          hint:'the steady middle',      test:g => g.pw > 0.33 && g.pw < 0.67 },
      { key:'lo',  nm:'Low',    dot:'var(--outline-variant)',  hint:'only if there is room',  test:g => g.pw <= 0.33 },
    ];
    bands.forEach(b => {
      const inBand = goals.filter(b.test).sort((x,y) => y.pw - x.pw);
      html += `<div class="tier"><span class="dot" style="background:${b.dot}"></span>
                 <span class="nm">${b.nm}</span><span class="hint">· ${b.hint}</span></div>`;
      html += `<div class="tierbody ${b.key}">`;
      html += inBand.length
        ? inBand.map(g => card(g)).join('')
        : `<div class="tier-empty">Nothing here — drag a goal in.</div>`;
      html += `</div>`;
    });
  } else if (variant === 'd') {
    html += legendHTML();
    // Rank is GLOBAL — it is the one order reorderAllWithPriority() writes.
    const ordered = [...goals].sort((x,y) => y.pw - x.pw);
    const rankOf = g => ordered.indexOf(g) + 1;
    if (dGroup === 'flat') {
      ordered.forEach(g => {
        html += card(g, `<div class="rank d ${rankOf(g) <= 2 ? 'top' : ''}">${rankOf(g)}</div>`);
      });
    } else {
      ['timeTarget','outcome','habit'].forEach(ty => {
        const inType = ordered.filter(g => g.ty === ty);
        if (!inType.length) return;
        html += `<div class="sectionhdr">${TYPE[ty].section} <span class="cnt">· ${inType.length}</span></div>`;
        html += inType.map(g => card(g, `<div class="rank d ${rankOf(g) <= 2 ? 'top' : ''}">${rankOf(g)}</div>`)).join('');
      });
    }
  } else {
    ['timeTarget','outcome','habit'].forEach(ty => {
      const inType = goals.filter(g => g.ty === ty).sort((x,y) => y.pw - x.pw);
      if (!inType.length) return;
      html += `<div class="sectionhdr">${TYPE[ty].section} <span class="cnt">· ${inType.length}</span></div>`;
      html += inType.map(g => card(g)).join('');
    });
  }
  s.innerHTML = html;
}

function toast(m) {
  const t = document.getElementById('toast');
  t.textContent = m; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 1400);
}

document.addEventListener('click', (e) => {
  const vb = e.target.closest('[data-v]');
  if (vb) { variant = vb.dataset.v; syncVariantButtons(); render(); return; }
  // `button[data-mood]`, NOT `[data-mood]`: <body data-mood="3"> carries the same
  // attribute, so a bare selector matches the body on EVERY click and this branch
  // silently eats every handler below it.
  const mb = e.target.closest('button[data-mood]');
  if (mb) {
    document.body.dataset.mood = mb.dataset.mood;
    document.querySelectorAll('[data-mood]').forEach(b => b.setAttribute('aria-pressed', b === mb));
    return;
  }
  const gb = e.target.closest('[data-group]');
  if (gb) {
    dGroup = gb.dataset.group;
    document.querySelectorAll('[data-group]').forEach(b => b.setAttribute('aria-pressed', b === gb));
    if (variant !== 'd') { variant = 'd'; syncVariantButtons(); }
    render(); return;
  }
  const lb = e.target.closest('[data-line]');
  if (lb) {
    dLine = lb.dataset.line;
    document.querySelectorAll('[data-line]').forEach(b => b.setAttribute('aria-pressed', b === lb));
    if (variant !== 'd') { variant = 'd'; syncVariantButtons(); }
    render(); return;
  }
  const ob = e.target.closest('[data-out]');
  if (ob) {
    dOutcome = ob.dataset.out;
    document.querySelectorAll('[data-out]').forEach(b => b.setAttribute('aria-pressed', b === ob));
    if (variant !== 'd') { variant = 'd'; syncVariantButtons(); }
    render(); return;
  }
  if (e.target.closest('#progtoggle')) {
    dProgress = !dProgress;
    document.getElementById('progtoggle').setAttribute('aria-pressed', dProgress);
    if (variant !== 'd') { variant = 'd'; syncVariantButtons(); }
    render(); return;
  }
  if (e.target.closest('.grip')) { toast('Press and hold to drag — reorder writes priority'); return; }
  if (e.target.closest('.gcard')) { toast('Opens the goal form'); return; }
  if (e.target.closest('.fab'))   { toast('Opens the full goal form'); return; }
});

render();
</script>
</body>
</html>
